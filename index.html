<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converge — Loan Review Stations</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17213a;background:#f5f6fa}
*{box-sizing:border-box}body{margin:0;background:#f5f6fa}a{text-decoration:none;color:inherit}
.topbar{height:72px;background:#fff;border-bottom:1px solid #e4e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:#18213c;color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#7d8799;font-size:11px;margin-top:2px}
.rolebar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.badge{padding:6px 9px;border-radius:8px;background:#eef1ff;color:#4559ca;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#eef1f5;display:grid;place-items:center;font-size:11px;font-weight:900}.user small{display:block;color:#8a94a5;font-size:10px}.link{font-size:12px;color:#687386;font-weight:800}
main{max-width:1240px;margin:auto;padding:38px 28px 60px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:900;color:#7f899b}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.heading h1{font-size:34px;letter-spacing:-.035em;margin:8px 0 0}.lede{color:#737e91;font-size:14px;max-width:720px;line-height:1.55;margin:10px 0 0}
.count{background:#fff;border:1px solid #e3e7ed;border-radius:14px;padding:14px 18px;min-width:105px}.count span{display:block;text-transform:uppercase;color:#8a94a5;font-size:9px;font-weight:900;letter-spacing:.1em}.count b{display:block;font-size:26px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:24px}.card{display:block;background:#fff;border:1px solid #e1e6ed;border-radius:18px;padding:19px;transition:.16s}.card:hover{box-shadow:0 14px 36px rgba(23,32,51,.08);transform:translateY(-2px)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.id{font-size:10px;color:#8b94a5;font-weight:900;letter-spacing:.1em}.chip{font-size:10px;background:#f2f4f7;padding:6px 8px;border-radius:7px;color:#636d7e;font-weight:800}
.card h2{font-size:19px;margin:14px 0 16px;letter-spacing:-.02em}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{background:#f7f8fa;border-radius:10px;padding:9px}.fact span{display:block;color:#8a94a5;text-transform:uppercase;font-size:9px;font-weight:900}.fact b{display:block;font-size:15px;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}.status i{width:6px;height:6px;border-radius:50%;background:currentColor}.pass{color:#20744d;background:#eaf7ef}.issue{color:#ab4c3e;background:#fff0ec}.wait{color:#996c16;background:#fff5de}.na{color:#687386;background:#f0f2f5}
.stage{border:1px solid #e6e9ef;border-radius:12px;padding:12px;margin-top:14px}.stage small{color:#8a94a5;text-transform:uppercase;font-size:9px;font-weight:900}.flow{display:grid;grid-template-columns:12px 1fr 12px;align-items:center;gap:5px;margin-top:12px}.dot{width:12px;height:12px;border-radius:50%;background:#4f61d2;border:3px solid #dfe3ff}.muted{background:#cfd4df;border-color:#eef0f4}.line{height:2px;background:#dfe3e9}.stagefooter{display:flex;justify-content:space-between;color:#7b8496;font-size:10px;margin-top:10px}
.banner{margin-top:18px;background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:13px 15px;color:#707b8e;font-size:11px;line-height:1.5}.back{display:inline-block;margin-bottom:18px;color:#667186;font-size:12px;font-weight:800}
.hero{background:#fff;border:1px solid #e1e6ed;border-radius:19px;padding:22px 24px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:6px 0;font-size:30px;letter-spacing:-.03em}.sub{color:#7a8496;font-size:12px}.heroRight{text-align:right}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:12px}.metric{background:#fff;border:1px solid #e1e6ed;border-radius:13px;padding:14px}.metric span{display:block;color:#8892a4;font-size:9px;text-transform:uppercase;font-weight:900}.metric b{display:block;margin-top:6px;font-size:20px}.metric small{display:block;color:#7d8799;margin-top:3px;font-size:9px}
.section{background:#fff;border:1px solid #e1e6ed;border-radius:17px;margin-top:13px;overflow:hidden}.sectionhead{padding:17px 19px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:15px}.sectionhead h2{margin:8px 0 0;font-size:17px}.sectionhead p{margin:5px 0 0;color:#7b8598;font-size:10px}.docs{padding:3px 19px}.doc{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f4}.doc:last-child{border-bottom:0}.docicon{width:32px;height:32px;border-radius:9px;background:#f1f3f6;display:grid;place-items:center;color:#6c7687}.doc strong{font-size:12px}.doc p{margin:4px 0;color:#778194;font-size:11px;line-height:1.45}.source{font-size:9px;color:#59657a;font-weight:700}.fetched{color:#237a51;background:#eaf7ef;padding:5px 7px;border-radius:7px;font-size:9px;font-weight:900;height:max-content}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.item{padding:15px 18px;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:26px 1fr;gap:10px}.item:last-child{border-bottom:0}.itemicon{width:22px;height:22px;border-radius:7px;background:#f0f2f6;display:grid;place-items:center;font-size:11px;font-weight:900}.item h3{margin:0;font-size:12px;line-height:1.35}.item p{margin:5px 0;color:#737e91;font-size:10px;line-height:1.45}.actions{margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{display:inline-block;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:900}.primary{background:#1d2a55;color:#fff}.secondary{background:#eef1ff;color:#4053bd}.readonly{font-size:9px;color:#8a94a5;font-weight:800}.lock{font-size:9px;color:#996c16;background:#fff6e3;border:1px solid #f2dfb4;border-radius:7px;padding:5px 7px;margin-top:7px;display:inline-block}
.login{min-height:100vh;background:radial-gradient(circle at 20% 0,#fff 0,#f4f5fb 45%,#eef1f7 100%)}.loginmain{max-width:900px;padding-top:90px}.loginmain h1{font-size:46px;letter-spacing:-.045em;margin:8px 0}.loginlead{color:#707b8e;max-width:690px;line-height:1.6;font-size:14px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:30px}.rolecard{display:block;background:#fff;border:1px solid #dfe4ec;border-radius:20px;padding:24px}.rolecard:hover{box-shadow:0 16px 42px rgba(26,37,66,.09);transform:translateY(-2px)}.tag{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#4b5cca;background:#eef1ff;padding:6px 8px;border-radius:7px}.teal .tag{color:#177871;background:#e9f8f6}.icon{margin:22px 0 14px;width:44px;height:44px;border-radius:14px;background:#f0f2ff;color:#495cca;display:grid;place-items:center;font-size:22px;font-weight:900}.teal .icon{background:#e9f8f6;color:#187c75}.rolecard h2{font-size:23px;margin:0 0 3px}.rolecard p{color:#788395;font-size:12px;line-height:1.5;min-height:48px}.perm{border-top:1px solid #edf0f4;padding-top:10px;margin-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#667184;font-weight:800}.loginNote{margin-top:18px;background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:13px 15px;color:#788395;font-size:10px;line-height:1.5}
@media(max-width:900px){.grid,.twocol,.roles{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.rolebar{display:none}.hero{flex-direction:column}.heroRight{text-align:left}}@media(max-width:600px){.topbar{padding:0 14px}.user .ucopy{display:none}main{padding:25px 14px}.heading{align-items:flex-start;flex-direction:column}.count{width:100%}.loginmain h1{font-size:34px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div>
<script>
const LOANS=[{"id":"A","product":"Rental","entity":"Maple Grove Holdings LLC","ltv":"72%","dscr":"1.28","credit":"712 / 698","closed":true,"docs":[["Operating Agreement","Ownership","Two members hold 60% / 40%; the entity is Maple Grove Holdings LLC.","Page 4, §3.1"],["Appraisal","Valuation","Supports 72% LTV for the rental product.","Page 12"],["Credit Reports","Credit","Both guarantors are identified; scores are 712 and 698.","Current reports"],["Sponsor History","Experience","Eight completed rental acquisitions over six years.","Sponsor history"],["Insurance Certificate","Insurance","Coverage is on file and runs through the loan term.","Certificate"],["Closing / Recording","Deed of trust","Loan closed four days ago; recorded deed is still pending with the county.","County status"],["Note + Closing Docs","Name consistency","Entity name matches across note, closing documents and operating agreement.","Closing package"]],"underwriting":[["ltv","LTV within product limits","72% is within the prototype rental limit of 75%.","72% vs 75%","Appraisal","ready"],["dscr","Rental DSCR is sufficient","1.28 exceeds the prototype rental minimum of 1.20.","1.28 vs 1.20","Rent roll / operating statement","ready"],["guarantors","All required guarantors identified","Both members are on the loan.","2 of 2 members","Operating agreement + note","ready"],["experience","Sponsor experience is adequate","Eight completed rental acquisitions support the proposed scope.","8 acquisitions","Sponsor history","ready"],["credit","Guarantor credit meets minimum","712 and 698 are above the prototype minimum of 650.","712 / 698","Credit reports","ready"]],"closing":[["insurance","Insurance is on file and in force through loan term","Coverage runs through the loan term.","Active through maturity","Insurance certificate","ready"],["trustee","Trustee certification on file when applicable","Not applicable because the borrower is an LLC.","N/A","Entity documents","na"],["exceptions","All underwriting exceptions approved","No underwriting exception is outstanding on the sample facts.","No exception","Underwriting record","ready"],["deed","Recorded deed of trust received","Not yet received; county recording is pending.","Pending","County status","waiting"],["name","Entity name matches note and operating agreement","Names match across the referenced closing documents.","Match","Note + closing docs","ready"]]},{"id":"B","product":"Fix-and-flip","entity":"Redstone Ventures LLC","ltv":"78%","dscr":"N/A","credit":"648","closed":false,"docs":[["Entity Formation","Borrower","Redstone Ventures LLC is a single-member entity.","Formation record"],["Appraisal","Valuation","Supports 78% LTV, within the prototype fix-and-flip limit of 80%.","Value summary"],["Credit Report","Credit","Sole member score is 648; exception request is pending.","Credit report"],["Sponsor History","Experience","No prior projects are documented against a full gut renovation scope.","Sponsor history"],["Insurance","Insurance","Nothing is on file.","Document intake"],["Closing Package","Closing status","No closing documents yet because the loan has not closed.","Closing package"]],"underwriting":[["ltv","LTV within product limits","78% is within the prototype fix-and-flip limit of 80%.","78% vs 80%","Appraisal","ready"],["dscr","Debt service coverage is sufficient","Not applicable because fix-and-flip has no rental income.","N/A","Product type","na"],["guarantors","All required guarantors identified","The sole member is the guarantor on the loan.","1 of 1","Entity + application","ready"],["experience","Sponsor experience is adequate for scope","No prior projects against a full gut renovation requires manual review or exception.","0 projects","Sponsor history","issue"],["credit","Guarantor credit meets minimum / exception","648 is below the prototype minimum; exception is awaiting decision.","648; exception pending","Credit report + exception","waiting"]],"closing":[["insurance","Insurance is on file and in force through loan term","Nothing is on file; closing cannot confirm coverage.","Missing","Document intake","waiting"],["trustee","Trustee certification on file when applicable","Not applicable because the borrower is an LLC.","N/A","Entity documents","na"],["exceptions","All underwriting exceptions approved","Credit exception is still awaiting decision.","Pending approval","Underwriting record","waiting"],["deed","Recorded deed of trust received","Not applicable because the loan has not closed.","N/A","Closing status","na"],["name","Entity name matches note and operating agreement","No closing documents exist yet, so this cannot be verified.","Cannot verify","Closing package","waiting"]]},{"id":"C","product":"Rental","entity":"The Harrington Family Trust","ltv":"68%","dscr":"1.15","credit":"754","closed":true,"docs":[["Trust Document","Borrower","Legal entity is The Harrington Family Trust; one trustee is on the loan.","Trust document"],["Appraisal","Valuation","Supports 68% LTV, below the prototype rental limit of 75%.","Value summary"],["Rent Roll / DSCR","Coverage","DSCR is 1.15, below the prototype rental minimum of 1.20.","Coverage calculation"],["Credit Report","Credit","Trustee guarantor score is 754.","Credit report"],["Sponsor History","Experience","Twelve prior rental properties held long term.","Sponsor history"],["Insurance Certificate","Insurance","Coverage is on file but expires two months before maturity.","Certificate"],["Trustee Certification","Trustee","Required certification is not on file.","Document intake"],["Recorded Deed","Deed of trust","Recorded deed of trust is received and on file.","Recorded instrument"],["Note + Trust Document","Name consistency","Note says Harrington Family Trust; trust document uses the fuller legal name with Revocable Trust dated March 3, 2011.","Name comparison"]],"underwriting":[["ltv","LTV within product limits","68% is within the prototype rental limit of 75%.","68% vs 75%","Appraisal","ready"],["dscr","Rental DSCR is sufficient","1.15 is below the prototype rental minimum of 1.20.","1.15 vs 1.20","Rent roll / DSCR","issue"],["guarantors","All required guarantors identified","One trustee is identified on the loan.","1 trustee","Trust document + note","ready"],["experience","Sponsor experience is adequate","Twelve prior rental properties held long term support the rental scope.","12 rentals","Sponsor history","ready"],["credit","Guarantor credit meets minimum","754 is above the prototype minimum of 650.","754 vs 650","Credit report","ready"]],"closing":[["insurance","Insurance is on file and in force through loan term","Coverage expires two months before maturity.","Expires before maturity","Insurance certificate","issue"],["trustee","Trustee certification on file when applicable","Required trustee certification is missing.","Missing","Trustee certification","issue"],["exceptions","All underwriting exceptions approved","The unresolved DSCR issue means downstream exception approval is not confirmed.","Upstream issue","Underwriting review","waiting"],["deed","Recorded deed of trust received","Recorded deed has been received and is on file.","Received","Recorded deed","ready"],["name","Entity name matches note and operating agreement","The note and trust document use different legal-name strings. This needs human/legal review, not simple string equality.","Two variants","Note + trust document","issue"]]}];
const ROLE={station1:{label:"Station 1",title:"Underwriting",short:"Underwriter",desc:"Review leverage, coverage, guarantors, sponsor experience and guarantor credit."},station2:{label:"Station 2",title:"Closing",short:"Closer",desc:"Review insurance, trust documentation, exceptions, deed recording and entity naming."}};
const p=new URLSearchParams(location.search), role=p.get("role"), loanId=p.get("loan"), done=p.get("done");
function L(){return LOANS.find(x=>x.id===loanId)} function arr(L,s){return L[s==="station1"?"underwriting":"closing"]}
function effective(it){return done===it[0]?"ready":it[5]}
function sum(L,s){let a=arr(L,s),r={ready:0,issue:0,waiting:0,na:0,total:a.length};a.forEach(x=>r[effective(x)]++);return r}
function blocked(L){let s=sum(L,"station1");return s.issue+s.waiting>0}
function stateP(s){let cls=s==="ready"?"pass":s==="issue"?"issue":s==="waiting"?"wait":"na",tx=s==="ready"?"Ready":s==="issue"?"Needs action":s==="waiting"?"Waiting":"N/A";return '<span class="status '+cls+'"><i></i>'+tx+'</span>'}
function head(){let r=ROLE[role];return '<header class="topbar"><a class="brand" href="?"><div class="mark">C</div><div><b>Converge</b><small>Credit intelligence · Loan review</small></div></a><div class="rolebar"><span class="badge">'+r.label+'</span>'+r.title+'</div><div class="user"><div class="avatar">'+r.short.slice(0,2).toUpperCase()+'</div><div class="ucopy"><b style="font-size:12px">'+r.short+'</b><small>Demo lender workspace</small></div><a class="link" href="?">Switch role</a></div></header>'}
function login(){document.getElementById("app").innerHTML='<div class="login"><main class="loginmain"><div class="eyebrow">CONVERGE · LOAN REVIEW STATIONS</div><h1>Review the loan.<br>Know what is blocking it.</h1><p class="loginlead">Choose the station you work at. You can see the full loan state across both stations, but only act on the checklist owned by your role.</p><div class="roles"><a class="rolecard" href="?role=station1"><span class="tag">Station 1</span><div class="icon">↗</div><h2>Underwriting</h2><p>Review leverage, DSCR, guarantors, sponsor experience and guarantor credit before approval.</p><div class="perm"><span>Can action underwriting</span><span>✓</span></div><div class="perm"><span>Can view closing</span><span>✓</span></div></a><a class="rolecard teal" href="?role=station2"><span class="tag">Station 2</span><div class="icon">✓</div><h2>Closing</h2><p>Review insurance, trust documentation, exceptions, deed recording and name consistency before funding.</p><div class="perm"><span>Can action closing</span><span>✓</span></div><div class="perm"><span>Can view underwriting</span><span>✓</span></div></a></div><div class="loginNote"><b>Prototype access</b><br>No password is required. Production authentication and permissions would be enforced by the lender identity provider.</div></main></div>'}
function queue(){let cards=LOANS.map(function(x){let s=sum(x,role),os=role==="station2"&&blocked(x)?"waiting":s.issue+s.waiting?"issue":"ready",ol=role==="station2"&&blocked(x)?"Blocked by underwriting":s.issue?"Needs action":s.waiting?"Waiting":"Ready";return '<a class="card" href="?role='+role+'&loan='+x.id+'"><div class="row"><span class="id">LOAN '+x.id+'</span><span class="chip">'+x.product+'</span></div><h2>'+x.entity+'</h2><div class="facts"><div class="fact"><span>LTV</span><b>'+x.ltv+'</b></div><div class="fact"><span>DSCR</span><b>'+x.dscr+'</b></div><div class="fact"><span>Credit</span><b>'+x.credit.split(" / ")[0]+'</b></div></div><div class="stage"><div class="row"><small>'+ROLE[role].title+'</small>'+stateP(os)+'</div><div class="flow"><span class="dot"></span><span class="line"></span><span class="dot muted"></span></div><div class="row" style="font-size:9px;color:#7f899b;margin-top:5px"><span>Station 1</span><span>Station 2</span></div><div class="stagefooter"><span>'+s.ready+'/'+s.total+' ready</span><span>'+((s.issue||0)+(s.waiting||0))+' needing attention</span></div></div><div style="margin-top:16px;font-size:11px;font-weight:900;color:#485bc8;display:flex;justify-content:space-between"><span>View loan review</span><span>→</span></div></a>'}).join("");document.getElementById("app").innerHTML=head()+'<main><div class="heading"><div><div class="eyebrow">'+ROLE[role].label.toUpperCase()+' · '+ROLE[role].title.toUpperCase()+'</div><h1>Loan review queue</h1><p class="lede">'+ROLE[role].desc+' The other station is visible read-only.</p></div><div class="count"><span>Loans in view</span><b>3</b></div></div><div class="grid">'+cards+'</div><div class="banner"><b style="color:#4f596c">Role permissions are active.</b> You are signed in as '+ROLE[role].short+'. You can update only your own station checklist.</div></main>'}
function docs(L){return L.docs.map(function(d){return '<div class="doc"><div class="docicon">▤</div><div><strong>'+d[0]+'</strong><p><b>'+d[1]+':</b> '+d[2]+'</p><span class="source">'+d[3]+'</span></div><span class="fetched">Fetched</span></div>'}).join("")}
function checklist(L,s){let own=role===s,a=arr(L,s),locked=s==="station2"&&blocked(L),sm=sum(L,s);let rows=a.map(function(it){let st=effective(it),action="";if(own&&st!=="ready"&&st!=="na"){action=locked?'<span class="readonly">Locked by upstream underwriting</span>':'<a class="btn '+(st==="issue"?"secondary":"primary")+'" href="?role='+role+'&loan='+L.id+'&done='+it[0]+'">'+(s==="station1"&&st==="issue"?"Record review / escalate":st==="issue"?"Mark condition resolved":"Mark reviewed")+'</a>'}else if(!own)action='<span class="readonly">Read-only · owned by '+ROLE[s].short+'</span>';return '<div class="item"><div class="itemicon">'+(st==="ready"?"✓":st==="issue"?"!":st==="waiting"?"…":"–")+'</div><div><div class="row"><h3>'+it[1]+'</h3>'+stateP(st)+'</div><p><b>'+it[2]+'</b></p><p><span class="source">Value: '+it[3]+' · Source: '+it[4]+'</span></p><div class="actions">'+action+'</div></div></div>'}).join("");return '<section class="section"><div class="sectionhead"><div><span class="badge">'+ROLE[s].label+'</span><h2>'+ROLE[s].title+' checklist</h2><p>'+ROLE[s].desc+'</p>'+(locked?'<div class="lock">🔒 Locked until Station 1 is complete</div>':"")+'</div><div>'+sm.ready+'/'+sm.total+'</div></div>'+rows+'</section>'}
function detail(){let x=L(),other=role==="station1"?"station2":"station1";document.getElementById("app").innerHTML=head()+'<main><a class="back" href="?role='+role+'">← Back to loan queue</a><div class="hero"><div><div class="eyebrow">LOAN '+x.id+' · '+x.product.toUpperCase()+'</div><h1>'+x.entity+'</h1><div class="sub">Borrowing entity <b>'+x.entity+'</b> · '+(x.closed?"Closed":"Not closed")+'</div></div><div class="heroRight"><div class="eyebrow">CURRENT STATUS</div>'+stateP(blocked(x.id)?"issue":"ready")+'<div class="sub" style="margin-top:5px">Action only: '+ROLE[role].title+'</div></div></div><div class="metrics"><div class="metric"><span>Loan-to-value</span><b>'+x.ltv+'</b><small>'+x.product+'</small></div><div class="metric"><span>Debt service coverage</span><b>'+x.dscr+'</b><small>Coverage ratio</small></div><div class="metric"><span>Guarantor credit</span><b>'+x.credit+'</b><small>Guarantor profile</small></div><div class="metric"><span>Sponsor history</span><b>'+(x.id==="A"?"8 acquisitions":x.id==="B"?"0 projects":"12 rentals")+'</b><small>Documented experience</small></div></div><section class="section"><div class="sectionhead"><div><div class="eyebrow">SOURCE-LINKED VIEW</div><h2>Documents fetched</h2><p>Representative documents mapped to the sample facts.</p></div></div><div class="docs">'+docs(x)+'</div></section><div class="twocol">'+checklist(x,role)+checklist(x,other)+'</div><div class="banner"><b>Station handoff:</b> each station can act only on its own checklist. The other station remains visible for context.</div></main>'}
if(role&&loanId&&L())detail(); else if(role)queue(); else login();
</script></body></html>

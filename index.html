<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converge — Loan Review Stations</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f5f6fa}
*{box-sizing:border-box}body{margin:0;background:#f5f6fa}button{font:inherit}
.top{height:72px;background:#fff;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center}.mark{width:36px;height:36px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#7f899b;font-size:11px;margin-top:2px}
.rolebar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.badge{padding:6px 9px;border-radius:8px;background:#eef1ff;color:#4559ca;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.user{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#eff1f4;display:grid;place-items:center;font-size:11px;font-weight:800}.user small{display:block;color:#8b94a5;font-size:10px}.linkbtn{background:none;border:0;color:#5e687b;font-size:12px;cursor:pointer}
main{max-width:1240px;margin:auto;padding:38px 28px 60px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:900;color:#7f899b}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.heading h1{font-size:34px;letter-spacing:-.035em;margin:8px 0 0}.lede{color:#737e91;font-size:14px;max-width:720px;line-height:1.55;margin:10px 0 0}.count{background:#fff;border:1px solid #e3e7ed;border-radius:14px;padding:14px 18px;min-width:105px}.count span{display:block;text-transform:uppercase;color:#8a94a5;font-size:9px;font-weight:900;letter-spacing:.1em}.count b{display:block;font-size:26px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:24px}.card{background:#fff;border:1px solid #e1e6ed;border-radius:18px;padding:19px;text-align:left;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(23,32,51,.08)}
.cardtop,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.id{font-size:10px;color:#8b94a5;font-weight:900;letter-spacing:.1em}.chip{font-size:10px;background:#f2f4f7;padding:6px 8px;border-radius:7px;color:#636d7e;font-weight:800}
.card h2{font-size:19px;margin:14px 0 16px;letter-spacing:-.02em}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{background:#f7f8fa;border-radius:10px;padding:9px}.fact span{display:block;color:#8a94a5;text-transform:uppercase;font-size:9px;font-weight:900}.fact b{display:block;font-size:15px;margin-top:4px}
.status{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}.status i{width:6px;height:6px;border-radius:50%;background:currentColor}.pass{color:#20744d;background:#eaf7ef}.issue{color:#ab4c3e;background:#fff0ec}.wait{color:#996c16;background:#fff5de}.na{color:#687386;background:#f0f2f5}
.stage{border:1px solid #e6e9ef;border-radius:12px;padding:12px;margin-top:14px}.stage small{color:#8a94a5;text-transform:uppercase;font-size:9px;font-weight:900}.flow{display:grid;grid-template-columns:12px 1fr 12px;align-items:center;gap:5px;margin-top:12px}.dot{width:12px;height:12px;border-radius:50%;background:#4f61d2;border:3px solid #dfe3ff}.muted{background:#cfd4df;border-color:#eef0f4}.line{height:2px;background:#dfe3e9}.stagefooter{display:flex;justify-content:space-between;color:#7b8496;font-size:10px;margin-top:10px}
.banner{margin-top:18px;background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:13px 15px;color:#707b8e;font-size:11px;line-height:1.5}
.back{border:0;background:none;padding:0;color:#667186;font-size:12px;font-weight:800;cursor:pointer;margin-bottom:18px}.hero{background:#fff;border:1px solid #e1e6ed;border-radius:19px;padding:22px 24px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:6px 0;font-size:30px;letter-spacing:-.03em}.sub{color:#7a8496;font-size:12px}.heroRight{text-align:right}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:12px}.metric{background:#fff;border:1px solid #e1e6ed;border-radius:13px;padding:14px}.metric span{display:block;color:#8892a4;font-size:9px;text-transform:uppercase;font-weight:900}.metric b{display:block;margin-top:6px;font-size:20px}.metric small{display:block;color:#7d8799;margin-top:3px;font-size:9px}
.section{background:#fff;border:1px solid #e1e6ed;border-radius:17px;margin-top:13px;overflow:hidden}.sectionhead{padding:17px 19px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:15px}.sectionhead h2{margin:0;font-size:17px}.sectionhead p{margin:5px 0 0;color:#7b8598;font-size:10px}.docs{padding:3px 19px}.doc{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f4}.doc:last-child{border-bottom:0}.docicon{width:32px;height:32px;border-radius:9px;background:#f1f3f6;display:grid;place-items:center;color:#6c7687}.doc strong{font-size:12px}.doc p{margin:4px 0;color:#778194;font-size:11px;line-height:1.45}.source{font-size:9px;color:#59657a;font-weight:700}.fetched{color:#237a51;background:#eaf7ef;padding:5px 7px;border-radius:7px;font-size:9px;font-weight:900;height:max-content}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.item{padding:15px 18px;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:26px 1fr;gap:10px}.item:last-child{border-bottom:0}.itemicon{width:22px;height:22px;border-radius:7px;background:#f0f2f6;display:grid;place-items:center;font-size:11px;font-weight:900}.item h3{margin:0;font-size:12px;line-height:1.35}.item p{margin:5px 0;color:#737e91;font-size:10px;line-height:1.45}.actions{margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#1d2a55;color:#fff}.secondary{background:#eef1ff;color:#4053bd}.disabled{background:#f0f2f5;color:#8a94a5}.readonly{font-size:9px;color:#8a94a5;font-weight:800}.lock{font-size:9px;color:#996c16;background:#fff6e3;border:1px solid #f2dfb4;border-radius:7px;padding:5px 7px;margin-top:7px;display:inline-block}
.login{min-height:100vh;background:radial-gradient(circle at 20% 0,#fff 0,#f4f5fb 45%,#eef1f7 100%)}.loginmain{max-width:900px;padding-top:90px}.loginmain h1{font-size:46px;letter-spacing:-.045em;margin:8px 0}.loginlead{color:#707b8e;max-width:690px;line-height:1.6;font-size:14px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:30px}.rolecard{background:#fff;border:1px solid #dfe4ec;border-radius:20px;padding:24px;text-align:left;cursor:pointer}.rolecard:hover{box-shadow:0 16px 42px rgba(26,37,66,.09);transform:translateY(-2px)}.rolecard .tag{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#4b5cca;background:#eef1ff;padding:6px 8px;border-radius:7px}.rolecard.teal .tag{color:#177871;background:#e9f8f6}.rolecard .icon{margin:22px 0 14px;width:44px;height:44px;border-radius:14px;background:#f0f2ff;color:#495cca;display:grid;place-items:center;font-size:22px;font-weight:900}.rolecard.teal .icon{background:#e9f8f6;color:#187c75}.rolecard h2{font-size:23px;margin:0 0 3px}.rolecard p{color:#788395;font-size:12px;line-height:1.5;min-height:48px}.perm{border-top:1px solid #edf0f4;padding-top:10px;margin-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#667184;font-weight:800}.loginNote{margin-top:18px;background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:13px 15px;color:#788395;font-size:10px;line-height:1.5}
@media(max-width:900px){.grid,.twocol{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.rolebar{display:none}.hero{flex-direction:column}.heroRight{text-align:left}}@media(max-width:600px){.top{padding:0 14px}.user div:not(.avatar){display:none}main{padding:25px 14px}.heading{align-items:flex-start;flex-direction:column}.count{width:100%}.loginmain h1{font-size:34px}.roles{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const loans=[
{id:"A",product:"Rental",entity:"Maple Grove Holdings LLC",ltv:72,dscr:1.28,credit:[712,698],history:"Eight completed rental acquisitions over six years",closed:true,
docs:[["Operating Agreement","Ownership","Two members hold 60% / 40%; entity identified as Maple Grove Holdings LLC.","Page 4, §3.1"],["Appraisal","Valuation","Supports a 72% loan-to-value for the rental product.","Page 12, value summary"],["Credit Reports","Credit","Both guarantors are identified; scores are 712 and 698.","Reports dated current"],["Sponsor History","Experience","Eight completed rental acquisitions over six years.","Sponsor questionnaire"],["Insurance Certificate","Insurance","Coverage is on file and runs through the loan term.","Certificate #MG-2026"],["Closing / Recording","Deed of trust","Loan closed four days ago; recorded deed of trust is still pending.","County recording status"],["Note + Closing Docs","Name consistency","Entity name matches across note, closing documents and operating agreement.","Closing package"]],
underwriting:[["ltv","LTV within product limit","72% is within the assumed 75% rental LTV limit.","72% vs 75% limit","Operating Agreement / Appraisal","accept"],["dscr","Rental DSCR sufficient","1.28 exceeds the assumed 1.20 rental DSCR minimum.","1.28 vs 1.20 minimum","Rent roll / appraisal","accept"],["guarantors","All required guarantors identified","Both members are on the loan.","2 of 2 members","Operating Agreement + Note","accept"],["experience","Sponsor experience adequate","Eight completed rental acquisitions support the proposed rental scope.","8 completed acquisitions","Sponsor history","accept"],["credit","Guarantor credit meets minimum","712 and 698 are above the assumed 650 minimum.","712 / 698 vs 650","Credit reports","accept"]],
closing:[["insurance","Insurance in force through term","Certificate coverage runs through the loan term.","Active through maturity","Insurance Certificate","accept"],["trustee","Trustee certification required","Not applicable: borrowing entity is an LLC, not a trust.","N/A","Entity formation docs","na"],["exceptions","Underwriting exceptions approved","No underwriting exception is outstanding on the sample facts.","No exception","Underwriting record","accept"],["deed","Recorded deed of trust received","Not yet received; recording is pending with the county.","Pending","County recording status","wait"],["name","Entity name matches","Names match across note, closing docs and operating agreement.","Match","Note + closing docs","accept"]]},
{id:"B",product:"Fix-and-flip",entity:"Redstone Ventures LLC",ltv:78,dscr:null,credit:[648],history:"No prior projects. Full gut renovation.",closed:false,
docs:[["Entity Formation","Borrower","Redstone Ventures LLC has one member holding 100%.","Formation record"],["Appraisal","Valuation","Supports a 78% loan-to-value for the fix-and-flip product.","Value / leverage summary"],["Credit Report","Credit","Sole member score is 648; exception request is pending.","Credit report"],["Sponsor History","Experience","No prior projects; scope is a full gut renovation.","Sponsor questionnaire"],["Insurance","Insurance","No evidence of insurance is on file.","Document intake"],["Closing Package","Closing status","No closing documents yet because the loan has not closed.","Closing package"] ],
underwriting:[["ltv","LTV within product limit","78% is within the assumed 80% fix-and-flip LTV limit.","78% vs 80% limit","Appraisal","accept"],["dscr","Rental DSCR sufficient","Not applicable: fix-and-flip has no rental income.","N/A","Product classification","na"],["guarantors","All required guarantors identified","The sole member is the guarantor on the loan.","1 of 1 members","Entity formation + note","accept"],["experience","Sponsor experience adequate","No prior projects against a full gut renovation scope leaves an experience concern.","0 prior projects","Sponsor history","escalate"],["credit","Guarantor credit meets minimum / exception","648 is below the assumed 650 minimum; credit exception is awaiting decision.","648 vs 650; exception pending","Credit report + exception request","wait"]],
closing:[["insurance","Insurance in force through term","Nothing is on file. Closing cannot confirm coverage yet.","Missing","Document intake","wait"],["trustee","Trustee certification required","Not applicable: borrowing entity is an LLC, not a trust.","N/A","Entity formation docs","na"],["exceptions","Underwriting exceptions approved","Credit exception is still awaiting decision.","Pending approval","Exception request","wait"],["deed","Recorded deed of trust received","Not applicable: the loan has not closed.","N/A","Closing status","na"],["name","Entity name matches","No closing documents yet, so this cannot be verified.","Cannot verify yet","Closing package","wait"]]},
{id:"C",product:"Rental",entity:"The Harrington Family Trust",ltv:68,dscr:1.15,credit:[754],history:"Twelve prior rental properties held long term",closed:true,
docs:[["Trust Document","Borrower","Borrowing entity is The Harrington Family Trust; one trustee is on the loan.","Trust document"],["Appraisal","Valuation","Supports a 68% loan-to-value for the rental product.","Value / leverage summary"],["Rent Roll / DSCR","Coverage","Debt service coverage is 1.15, below the assumed 1.20 rental threshold.","Coverage calculation"],["Credit Report","Credit","Trustee guarantor score is 754.","Credit report"],["Sponsor History","Experience","Twelve prior rental properties held long term.","Sponsor questionnaire"],["Insurance Certificate","Insurance","Certificate is on file, but coverage expires two months before maturity.","Certificate #HF-2026"],["Trustee Certification","Trustee","Required certification is not on file.","Document intake"],["Recorded Deed","Deed of trust","Recorded deed of trust is received and on file.","Recorded instrument"],["Note + Trust Document","Name consistency","Note says “Harrington Family Trust”; trust document says “The Harrington Family Revocable Trust dated March 3, 2011”.","Name comparison"]],
underwriting:[["ltv","LTV within product limit","68% is within the assumed 75% rental LTV limit.","68% vs 75% limit","Appraisal","accept"],["dscr","Rental DSCR sufficient","1.15 is below the assumed 1.20 rental DSCR minimum.","1.15 vs 1.20 minimum","Rent roll / DSCR","escalate"],["guarantors","All required guarantors identified","One trustee is identified on the loan; trust structure warrants review of trustee documentation.","1 trustee","Trust document + note","accept"],["experience","Sponsor experience adequate","Twelve prior rental properties held long term support the rental scope.","12 prior rentals","Sponsor history","accept"],["credit","Guarantor credit meets minimum","754 is above the assumed 650 minimum.","754 vs 650","Credit report","accept"]],
closing:[["insurance","Insurance in force through term","Coverage expires two months before loan maturity, creating a term gap.","Expires before maturity","Insurance Certificate","fix"],["trustee","Trustee certification required","Required trustee certification is not on file.","Missing","Trustee certification","fix"],["exceptions","Underwriting exceptions approved","The DSCR issue is not resolved at underwriting, so downstream approval is not confirmed.","Upstream issue","Underwriting checklist","wait"],["deed","Recorded deed of trust received","Received and on file.","Received","Recorded deed","accept"],["name","Entity name matches","The trust name differs between the note and operating/trust document. Human review is needed rather than simple string equality.","Two legal-name variants","Note + trust document","fix"]]}
];
const roles={station1:{label:"Station 1",title:"Underwriting",user:"Avery · Underwriter",desc:"Check leverage, coverage, guarantors, sponsor experience and guarantor credit."},station2:{label:"Station 2",title:"Closing",user:"Jordan · Closer",desc:"Confirm insurance, trust documentation, exceptions, deed recording and entity naming."}};
let role=null,current=null,updates={};
function loan(id){return loans.find(x=>x.id===id)}
function key(id,s,k){return id+":"+s+":"+k}
function state(L,s,item){
 const u=updates[key(L.id,s,item[0])]; if(u)return u;
 const base=item[0];
 if(base==="dscr"&&L.dscr!==null&&L.dscr<1.2)return"issue";
 if(L.id==="B"&&s==="station1"&&base==="experience")return"issue";
 if(L.id==="B"&&s==="station1"&&base==="credit")return"waiting";
 if(L.id==="C"&&s==="station2"&&base==="insurance")return"issue";
 if(L.id==="C"&&s==="station2"&&base==="trustee")return"issue";
 if(L.id==="C"&&s==="station2"&&base==="name")return"issue";
 if(L.id==="C"&&s==="station2"&&base==="exceptions")return"waiting";
 if(L.id==="A"&&s==="station2"&&base==="deed")return"waiting";
 return item[8]==="na"?"na":"resolved";
}
function label(s){return s==="resolved"?"Ready":s==="issue"?"Needs action":s==="waiting"?"Waiting":"N/A"}
function pill(s){return '<span class="status '+(s==="resolved"?"pass":s==="issue"?"issue":s==="waiting"?"wait":"na")+'"><i></i>'+label(s)+'</span>'}
function summary(L,s){let arr=L[s==="station1"?"underwriting":"closing"],c={resolved:0,issue:0,waiting:0,na:0};arr.forEach(x=>c[state(L,s,x)]++);return{...c,total:arr.length}}
function blocked(L){let x=summary(L,"station1");return x.issue+x.waiting>0}
function top(){let r=roles[role];return '<header class="top"><div class="brand"><div class="mark">C</div><div><b>Converge</b><small>Credit intelligence · Loan review</small></div></div><div class="rolebar"><span class="badge">'+r.label+'</span>'+r.title+'</div><div class="user"><div class="avatar">'+r.user[0]+'</div><div><b style="font-size:12px">'+r.user.split(" · ")[0]+'</b><small>'+r.title+'</small></div><button class="linkbtn" onclick="login()">Switch role</button></div></header>'}
function login(){
role=null;current=null;document.getElementById("app").innerHTML='<div class="login"><main class="loginmain"><div class="eyebrow">CONVERGE · LOAN REVIEW STATIONS</div><h1>Review the loan.<br>Know what is blocking it.</h1><p class="loginlead">Choose the station you work at. You can see the full loan state across both stations, but only act on the checklist owned by your role.</p><div class="roles"><button class="rolecard" onclick="choose(&apos;station1&apos;)"><span class="tag">Station 1</span><div class="icon">↗</div><h2>Underwriting</h2><p>Review leverage, DSCR, guarantors, sponsor experience and guarantor credit before approval.</p><div class="perm"><span>Can action underwriting</span><span>✓</span></div><div class="perm"><span>Can view closing</span><span>✓</span></div></button><button class="rolecard teal" onclick="choose(&apos;station2&apos;)"><span class="tag">Station 2</span><div class="icon">✓</div><h2>Closing</h2><p>Review insurance, trust documentation, exceptions, deed recording and name consistency before funding.</p><div class="perm"><span>Can action closing</span><span>✓</span></div><div class="perm"><span>Can view underwriting</span><span>✓</span></div></button></div><div class="loginNote">Demo access — no password required. In production, role permissions would be enforced by the lender's identity provider and backend authorization.</div></main></div>'
}
function choose(r){role=r;queue()}
function queue(){
document.getElementById("app").innerHTML=top()+'<main><div class="heading"><div><div class="eyebrow">'+roles[role].label.toUpperCase()+' · '+roles[role].title.toUpperCase()+'</div><div style="display:flex;gap:20px;align-items:flex-end"><div><h1>Loan review queue</h1><p class="lede">'+roles[role].desc+' Your station can be updated; the other station is visible read-only.</p></div></div></div><div class="count"><span>Loans in view</span><b>3</b></div></div><div class="grid">'+loans.map(L=>{let s=summary(L,role),overallS=blocked(L)?"issue":role==="station2"&&s.waiting?"waiting":s.issue||s.waiting?"issue":"resolved";return '<button class="card" onclick="openLoan(&apos;'+L.id+'&apos;)"><div class="cardtop"><span class="id">LOAN '+L.id+'</span><span class="chip">'+L.product+'</span></div><h2>'+L.entity+'</h2><div class="facts"><div class="fact"><span>LTV</span><b>'+L.ltv+'%</b></div><div class="fact"><span>DSCR</span><b>'+(L.dscr??"—")+'</b></div><div class="fact"><span>Credit</span><b>'+Math.min(...L.credit)+'</b></div></div><div class="stage"><div class="row"><small>Your station</small>'+pill(overallS)+'</div><div class="flow"><span class="dot"></span><span class="line"></span><span class="dot muted"></span></div><div class="row" style="font-size:9px;color:#7f899b;margin-top:5px"><span>Station 1</span><span>Station 2</span></div><div class="stagefooter"><span>'+s.resolved+'/'+s.total+' ready</span><span>'+((s.issue||0)+(s.waiting||0))+' needing attention</span></div></div><div style="margin-top:16px;font-size:11px;font-weight:900;color:#485bc8;display:flex;justify-content:space-between"><span>View loan review</span><span>→</span></div></button>'}).join("")+'</div><div class="banner"><b style="color:#4f596c">Role permissions active.</b> '+roles[role].user+' can update only '+roles[role].title+'. '+(role==="station2"?"Underwriting decisions remain read-only.":"Closing decisions remain read-only.")+'</div></main>'
}
function openLoan(id){current=id;detail()}
function detail(){
let L=loan(current),own=role,other=role==="station1"?"station2":"station1",ownArr=own==="station1"?L.underwriting:L.closing,otherArr=other==="station1"?L.underwriting:L.closing, o=summary(L,role), lock=other==="station2"&&blocked(L);
let docs=L.docs.map(d=>'<div class="doc"><div class="docicon">▤</div><div><strong>'+d[0]+'</strong><p><b>'+d[1]+':</b> '+d[2]+'</p><span class="source">'+d[3]+'</span></div><span class="fetched">Fetched</span></div>').join("");
const checklist=(s,arr,owning)=>'<div class="section"><div class="sectionhead"><div><span class="badge">'+roles[s].label+'</span><h2 style="margin-top:9px">'+roles[s].title+' checklist</h2><p>'+roles[s].desc+'</p>'+(s==="station2"&&blocked(L)?'<div class="lock">🔒 Locked until Station 1 is complete</div>':"")+'</div><div>'+pill(owning?o.resolved:summary(L,s).resolved)+'</div></div>'+arr.map(it=>{let st=state(L,s,it),act="";if(owning&&st!=="resolved"&&st!=="na"){if(s==="station1"&&it[8]==="accept")act='<button class="btn primary" onclick="actOn(&apos;'+s+'&apos;,&apos;'+it[0]+'&apos;,&apos;resolved&apos;)">Mark reviewed</button>';else if(s==="station1"&&it[8]==="escalate")act='<button class="btn secondary" onclick="actOn(&apos;'+s+'&apos;,&apos;'+it[0]+'&apos;,&apos;resolved&apos;)">Record review / escalate</button>';else if(s==="station2"&&!lock)act='<button class="btn primary" onclick="actOn(&apos;'+s+'&apos;,&apos;'+it[0]+'&apos;,&apos;resolved&apos;)">'+(st==="issue"?"Mark condition resolved":"Mark reviewed")+'</button>'}else if(!owning)act='<span class="readonly">Read-only · owned by '+roles[s].title+'</span>';if(owning&&lock&&s==="station2"&&st!=="resolved"&&st!=="na")act='<span class="readonly">Locked by upstream underwriting</span>';return '<div class="item"><div class="itemicon">'+(st==="resolved"?"✓":st==="issue"?"!":st==="waiting"?"…":"–")+'</div><div><div class="row"><h3>'+it[1]+'</h3>'+pill(st)+'</div><p><b>'+it[2]+'</b></p><p><span class="source">Value: '+it[3]+' · Source: '+it[4]+'</span></p><div class="actions">'+act+'</div></div></div>'}).join("")+'</div>';
document.getElementById("app").innerHTML=top()+'<main><button class="back" onclick="queue()">← Back to loan queue</button><div class="hero"><div><div class="eyebrow">LOAN '+L.id+' · '+L.product.toUpperCase()+'</div><h1>'+L.entity+'</h1><div class="sub">Borrowing entity <b>'+L.entity+'</b> · '+(L.closed?"Closed":"Not closed")+'</div></div><div class="heroRight"><div class="eyebrow">CURRENT STATUS</div>'+pill((blocked(L)?"issue":"resolved"))+'<div class="sub" style="margin-top:5px">Action only: '+roles[own].title+'</div></div></div><div class="metrics"><div class="metric"><span>Loan-to-value</span><b>'+L.ltv+'%</b><small>'+L.product+'</small></div><div class="metric"><span>Debt service coverage</span><b>'+(L.dscr??"N/A")+'</b><small>'+ (L.dscr==null?"No rental income":"Coverage ratio")+'</small></div><div class="metric"><span>Guarantor credit</span><b>'+L.credit.join(" / ")+'</b><small>'+L.credit.length+' guarantor'+(L.credit.length>1?"s":"")+'</small></div><div class="metric"><span>Sponsor history</span><b>'+L.history.split(".")[0]+'</b><small>Source-linked experience</small></div></div><div class="section"><div class="sectionhead"><div><div class="eyebrow">SOURCE-LINKED VIEW</div><h2>Documents fetched</h2><p>Representative documents mapped to the sample facts. This prototype does not read real files.</p></div></div><div class="docs">'+docs+'</div></div><div class="twocol" style="margin-top:13px">'+checklist(own,ownArr,true)+checklist(other,otherArr,false)+'</div><div class="banner"><b style="color:#4f596c">Station handoff:</b> each station can act only on its own checklist. Downstream users see upstream state as context, preventing silent changes to another team's decision.</div></main>'
}
function actOn(s,k,v){updates[key(current,s,k)]=v;detail()}
login();
